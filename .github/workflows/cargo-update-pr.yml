name: dependencies

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust toolchain; same syntax as dtolnay/rust-toolchain"
        default: "nightly"
        required: false
        type: "string"
      title:
        description: "PR title"
        default: "chore(deps): weekly `cargo update`"
        required: false
        type: "string"

permissions: {}

env:
  BRANCH: cargo-update
  BODY: |
    Automation to keep dependencies in `Cargo.lock` current.

    <details><summary><strong>cargo update log</strong></summary>
    <p>

    ```log
    $cargo_update_log
    ```

    </p>
    </details>

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    # The update branch is pushed and the PR opened with a short-lived GitHub
    # App token minted via github-sts rather than the built-in GITHUB_TOKEN,
    # which is not allowed to create pull requests. Callers must grant these
    # permissions on the reusable-workflow job and carry a trust policy at
    # .github/sts/cargo-update-pr.sts.yaml granting contents: write and
    # pull_requests: write to their own workflow.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@27b9d9cb079918e6be16c8660f82bb0cf7fef6ea # main

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@6f436eb3a168279692739e8c0c9fdb52b94bfae7
        with:
          toolchain: ${{ inputs.rust-toolchain }}

      - name: cargo update
        # Remove first line that always just says "Updating crates.io index"
        run: cargo update --color never --verbose 2>&1 | sed '/crates.io index/d' | tee -a cargo_update.log

      # The first-party PR action below fails when there is nothing to commit, so skip the
      # remaining steps when `cargo update` left Cargo.lock untouched.
      - name: Detect Cargo.lock changes
        id: changes
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock is already up to date; no pull request needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Craft PR body
        if: steps.changes.outputs.changed == 'true'
        id: msg
        run: |
          cargo_update_log="$(cat cargo_update.log)"
          export cargo_update_log

          {
            echo "body<<EOF"
            echo "$BODY" | envsubst
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch GitHub token via STS
        if: steps.changes.outputs.changed == 'true'
        id: sts
        uses: tempoxyz/gh-actions/actions/github-sts@c0292122e255def866c64c55e5844d1e7d5fe7ad # main
        with:
          policy: cargo-update-pr

      # First-party replacement for peter-evans/create-pull-request. The commit is created
      # server-side, authored by the STS App and signed by GitHub, so author/committer inputs are
      # not needed. The composite takes a single-line commit headline; the cargo update log stays
      # in the PR body.
      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: tempoxyz/gh-actions/actions/create-pull-request@16356ec5155405ba5e33f5558e80b5bf77eb70ab # main
        with:
          token: ${{ steps.sts.outputs.token }}
          branch: ${{ env.BRANCH }}
          commit-message: ${{ inputs.title }}
          title: ${{ inputs.title }}
          body: ${{ steps.msg.outputs.body }}
          add-paths: Cargo.lock
