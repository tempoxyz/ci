name: deny

on:
  workflow_call:
    inputs:
      rust-toolchain:
        description: "Rust toolchain; same syntax as dtolnay/rust-toolchain"
        default: "nightly"
        required: false
        type: "string"
      deny-flags:
        description: "Additional flags passed to `cargo deny check`"
        default: "--all-features"
        required: false
        type: "string"
      runner:
        description: "Runner used for cargo deny"
        default: "ubuntu-latest"
        required: false
        type: "string"
      timeout-minutes:
        description: "Timeout for the cargo deny job"
        default: 30
        required: false
        type: "number"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    name: cargo deny check
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: tempoxyz/gh-actions/vendor/dtolnay/rust-toolchain@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@bce53819ffa60fcdf8f0f349686d807e5a66a71b # 2026-09-21T21-56-41Z-bce53819
        with:
          tool: cargo-deny@0.20.2
          checksum: true
          fallback: none
      # Keep dependency downloads on the host configured by Secure Runner.
      - name: Check dependencies
        shell: bash
        env:
          DENY_FLAGS: ${{ inputs.deny-flags }}
        run: |
          read -r -a deny_flags <<< "$DENY_FLAGS"
          cargo deny "${deny_flags[@]}" check all
